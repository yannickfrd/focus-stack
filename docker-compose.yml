services:
  db:
    image: postgres:16
    container_name: focus_stack_db
    environment:
      POSTGRES_DB: focus_stack
      POSTGRES_USER: app
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d focus_stack"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
